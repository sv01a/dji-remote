name: Build Watch APK

on:
  push:
    branches: [ main, feature/live-view ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, feature/live-view ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          # The wrapper distribution used to be pre-downloaded with curl because the runner's Java
          # HTTP client hit redirect timeouts against services.gradle.org. Using Gradle installed by
          # the official action avoids the wrapper download entirely; the cache is read-only because
          # this workflow cancels in-progress runs.
          cache-read-only: true

      - name: Build Release APK and run protocol unit tests
        run: |
          gradle :app:assembleRelease :app:testDebugUnitTest --no-daemon > /tmp/build.log 2>&1 || {
            grep -E "(e: [^\n]+|Compilation error|unresolved reference|FAILURE:)" /tmp/build.log | while IFS= read -r line; do
              echo "::error title=CompileError::$line"
            done
            tail -n 30 /tmp/build.log
            exit 1
          }

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
