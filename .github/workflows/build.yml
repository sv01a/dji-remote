name: Build Watch APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Pre-download Gradle distribution via curl
        run: |
          curl -sSL --retry 5 https://services.gradle.org/distributions/gradle-8.14-bin.zip -o /tmp/gradle-8.14-bin.zip
          ls -lh /tmp/gradle-8.14-bin.zip

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: |
          ./gradlew :app:assembleRelease --stacktrace --no-daemon > /tmp/build.log 2>&1 || {
            grep -E "(Caused by|FAILURE:|What went wrong|Execution failed for task)" -A 3 /tmp/build.log | head -n 30 | while IFS= read -r line; do
              echo "::error title=GradleCause::$line"
            done
            exit 1
          }
          find app/build/outputs -name "*.apk" || true

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
